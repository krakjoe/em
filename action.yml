name: 'em build'
description: 'Compile PHP to WebAssembly using the em build system'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  EM_PHP_DIR:
    description: 'Path to PHP source directory'
    required: true
  EM_PHP_CONFIGURE:
    description: 'Extra configure arguments for PHP'
    required: false
    default: ''
  EM_EMSDK_CFLAGS:
    description: 'Extra CFLAGS used when compiling with emcc'
    required: false
    default: ''
  EM_EMSDK_LDFLAGS:
    description: 'Extra LDFLAGS used when linking with emcc'
    required: false
    default: ''
  bake:
    description: 'Space-separated list of bakers'
    required: false
    default: ''
  without:
    description: 'Space-separated list of exclusions (only applies to bakers)'
    required: false
    default: ''
  with:
    description: 'Space-separated list of recipes to build (e.g. "ctype opcache pdo sqlite3")'
    required: false
    default: ''
  emsdk:
    description: 'emsdk version to use'
    required: false
    default: '4.0.11'

outputs:
  wasm-file:
    description: 'Path to generated WASM file'
    value: ${{ steps.build.outputs.wasm-file }}
  js-file:
    description: 'Path to generated JS file'
    value: ${{ steps.build.outputs.js-file }}

runs:
  using: 'composite'
  steps:
    - name: Setup emsdk
      uses: mymindstorm/setup-emsdk@v12
      with:
        version: ${{ inputs.emsdk }}

    - name: Validate PHP directory
      shell: bash
      run: |
        if [ ! -d "${{ inputs.EM_PHP_DIR }}" ]; then
          echo "Error: PHP directory '${{ inputs.EM_PHP_DIR }}' does not exist"
          exit 1
        fi
        if [ ! -f "${{ inputs.EM_PHP_DIR }}/configure.ac" ]; then
          echo "Error: '${{ inputs.EM_PHP_DIR }}' does not appear to be a PHP source directory"
          exit 1
        fi

    - name: Install PHP build Dependencies
      shell: bash
      run: |
        sudo apt install build-essential re2c bison autoconf

    - name: Build em
      id: build
      shell: bash
      run: |
        # Baking ...
        ACTION_BAKE="${{ inputs.bake }}"
        EM_BAKERS=""
        if [ -n "$ACTION_BAKE" ]; then
          for BAKER in $ACTION_BAKE; do
            EM_BAKERS="$EM_BAKERS bake-$BAKER"
          done
        fi

        # Excluding ...
        ACTION_WITHOUT="${{ inputs.without }}"
        EM_EXCLUSIONS=""
        if [ -n "$ACTION_WITHOUT" ]; then
          for EXCLUSION in $ACTION_WITHOUT; do
            EM_EXCLUSIONS="$EM_EXCLUSIONS without-$EXCLUSION"
          done
        fi

        # Including ...
        ACTION_WITH="${{ inputs.with }}"
        EM_RECIPES=""
        if [ -n "$ACTION_WITH" ]; then
          for RECIPE in $ACTION_WITH; do
            EM_RECIPES="$EM_RECIPES with-$RECIPE"
          done
        fi

        # Build command
        EM_PHP_DIR=${{ inputs.EM_PHP_DIR }} \
        EM_PHP_CONFIGURE=${{ inputs.EM_PHP_CONFIGURE }} \
        EM_EMSDK_CFLAGS=${{ inputs.EM_EMSDK_CFLAGS }} \
        EM_EMSDK_LDFLAGS=${{ inputs.EM_EMSDK_LDFLAGS }} \
          make -f ${{ github.action_path }}/em.mk \
            $EM_BAKERS $EM_EXCLUSIONS $EM_RECIPES

        # Copy outputs to current directory so caller can access them
        [ -f ./php-em.js ]   || { cp -f ${{ github.action_path }}/php-em.js ./;   }
        [ -f ./php-em.wasm ] || { cp -f ${{ github.action_path }}/php-em.wasm ./; }

        # Set outputs
        echo "wasm-file=$(pwd)/php-em.wasm" >> $GITHUB_OUTPUT
        echo "js-file=$(pwd)/php-em.js" >> $GITHUB_OUTPUT

        # Verify outputs exist
        if [ ! -f "php-em.wasm" ] || [ ! -f "php-em.js" ]; then
          echo "Error: Build completed but output files not found"
          exit 1
        fi

        # Show file sizes
        echo "Build completed successfully:"
        ls -lash php-em.wasm php-em.js