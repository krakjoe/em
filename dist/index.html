 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>em</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="browser.css">
    <link rel="stylesheet" href="configuration.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
</head>
<body>
    <div class="header">
        <div class="logo">em</div>
        <div class="controls">
            <select id="phpVersion">
                <option value="8.0">PHP 8.0</option>
                <option value="8.1">PHP 8.1</option>
                <option value="8.2">PHP 8.2</option>
                <option value="8.3">PHP 8.3</option>
                <option value="8.4">PHP 8.4</option>
                <option value="8.5">PHP 8.5</option>
                <option value="master">PHP master</option>
                <option disabled>_________</option>
                <option value="partials-v2-gen">PHP PFA2 RFC</option>
            </select>

            <button id="runButton">Run Code</button>
            <button id="toggleOutput">Toggle Output</button>
            <button id="clearOutput">Clear Output</button>
            <button id="toggleVFS">Toggle VFS</button>
            <button id="resetVFS">Reset VFS</button>
            <button id="previewButton">Open Browser</button>
            <button id="configurationButton">Configuration</button>
            <select id="demoSelect" class="demo-list">
                <option value="">Load Demo...</option>
                <option value="hello">Hello World</option>
                <option value="vfs">Virtual File System</option>
                <option value="http">HTTP Requests</option>
                <option value="sqlite">SQLite Database</option>
                <option value="oop">Object-Oriented PHP</option>
                <option value="generators">Generators & Iterators</option>
                <option value="match">Match Expression (8.0+)</option>
                <option value="enums">Enums (8.1+)</option>
                <option value="readonly">Readonly Properties (8.1+)</option>
            </select>
        </div>
    </div>

    <div class="main-container">
        <div id="file-explorer" class="file-explorer">
            <div class="explorer-header">
                <div class="explorer-controls">
                    <button id="newFile" title="New File">📄</button>
                    <button id="newFolder" title="New Folder">📁</button>
                    <button id="refreshFiles" title="Refresh">🔄</button>
                    <button id="importBtn" title="Import">📦</button>
                    <button id="exportBtn" title="Export">💾</button>
                    <button id="githubBtn" title="Load from GitHub">
                        <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" style="vertical-align:middle;">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.19 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="file-tree" id="fileTree">
                <div class="file-item" data-path="/">
                    <span class="expand-icon">▶</span>
                    <span class="file-icon">📁</span>
                    <span class="file-name">/</span>
                </div>
            </div>
        </div>

        <div class="editor-container">
            <!-- Tab bar for open files -->
            <div id="tabBar">
                <button class="tab-nav-button left">◀</button>
                <div class="tab-container"></div>
                <button class="tab-nav-button right">▶</button>
            </div>

            <div class="editor-panel">
                <div class="editor-header">
                    <span id="currentFile">PHP Code Editor</span>
                    <span id="editorStatus">Loading...</span>
                </div>
                <textarea id="codeEditor"></textarea>
                <div id="browser-container">
                    <div id="browser-toolbar">
                        <button id="browser-back" title="Back">⟨</button>
                        <button id="browser-forward" title="Forward">⟩</button>
                        <button id="browser-refresh" title="Refresh">⟳</button>
                        <input id="browser-url" type="text" value="/" spellcheck="false" autocomplete="off" />
                        <button id="browser-go" title="Go">Go</button>
                    </div>
                    <div id="browser-content">
                        <iframe 
                            id="browser-frame"
                            sandbox="allow-scripts allow-downloads allow-forms allow-same-origin"
                        >
                        </iframe>
                    </div>
                </div>
                <div id="configuration-container" style="display:none;">
                    <div id="configuration-header">Virtual Server Configuration</div>
                    <div id="configuration-content">
                        <form id="configuration-form">
                            <label for="vroot">Virtual Root</label>
                            <input type="text" name="vroot" placeholder="/virtual/" autocomplete="off" required/>
                            <label for="vroot">Boot Loader</label>
                            <input type="text" name="boot" placeholder="/virtual/boot.html" autocomplete="off" required/>
                            <label for="vroot">Server</label>
                            <input type="text" name="worker" placeholder="/virtual/worker.js" autocomplete="off" required/>
                            <label for="root">Document Root</label>
                            <input type="text" name="droot" placeholder="/" autocomplete="off" />
                            <label for="env">Environment Variables (JSON)</label>
                            <textarea name="env" rows="4" placeholder='{"FOO":"bar"}' json></textarea>
                            <div id="configuration-actions">
                                <button type="submit" id="configuration-save">Save</button>
                                <button type="button" id="configuration-reset">Reset to Defaults</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div id="output-panel" class="output-panel">
                <div class="output-resizer"></div>
                <div class="output-header">
                    <span>Output</span>
                    <span id="outputStatus"></span>
                </div>
                <div id="output" class="output">Loading PHP runtime...</div>
            </div>
        </div>
    </div>

    <div class="status" id="statusBar">
        Loading...
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div id="modal-content" class="modal-content">
            <h3 id="modal-title">Title</h3>
            <input type="text" class="modal-input" id="modal-input">
            <div id="modal-info" class="modal-info" style="display:none;"></div>
            <div class="modal-actions">
                <button id="modal-reject">Reject</button>
                <button id="modal-accept">Accept</button>
            </div>
        </div>
    </div>

    <!-- GitHub Context Menu (hidden by default) -->
    <div id="githubContextMenu" class="context-menu" style="display:none; min-width: 180px;">
        <div class="context-menu-item" data-action="set-token">Set GitHub Token</div>
        <div class="context-menu-item" data-action="load-repo">Load from Repo</div>
        <div class="context-menu-item" data-action="load-gist">Load from Gist</div>
    </div>

    <!-- Import Context Menu (hidden by default) -->
    <div id="importContextMenu" class="context-menu" style="display:none; min-width: 180px;">
        <div class="context-menu-item" data-action="import-vfs">Import VFS Image</div>
        <div class="context-menu-item" data-action="import-zip">Import ZIP</div>
    </div>

    <!-- Export Context Menu (hidden by default) -->
    <div id="exportContextMenu" class="context-menu" style="display:none; min-width: 180px;">
        <div class="context-menu-item" data-action="export-vfs">Export VFS Image</div>
        <div class="context-menu-item" data-action="export-zip">Export ZIP</div>
    </div>

    <!-- Context Menu -->
    <div id="contextMenu" class="context-menu">
        <!-- File Actions -->
        <div class="context-menu-item" data-action="run">Run</div>
        <div class="context-menu-item" data-action="open">Open</div>
        <div class="context-menu-item" data-action="browse">Browse</div>
        <div class="context-menu-item" data-action="download">Download</div>
        <!-- Directory Actions -->
        <div class="context-menu-item" data-action="export-vfs">Export VFS</div>
        <div class="context-menu-item" data-action="export-zip">Export ZIP</div>
        <!-- File/Directory Actions-->
        <div class="context-menu-separator"></div>
        <div class="context-menu-item" data-action="rename">Rename</div>
        <div class="context-menu-item" data-action="delete">Delete</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/php/php.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="zip.js"></script>
    <script src="vfsi.js"></script>
    <script src="modal.js"></script>
    <script src="main.js"></script>
    <script src="output-resizer.js"></script>
    <script src="configuration.js"></script>
    <script src="browser.js"></script>
    <script src="drop.js"></script>
</body>
</html>
