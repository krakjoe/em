<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>em</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background: #2d2d2d;
            padding: 1rem;
            border-bottom: 1px solid #404040;
            display: flex;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #8892b0;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        select, button {
            background: #404040;
            color: white;
            border: 1px solid #555;
            padding: 0.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        select:hover, button:hover {
            background: #4a4a4a;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .main-container {
            display: flex;
            height: calc(100vh - 80px);
            min-height: 0;
        }

        .file-explorer {
            width: 300px;
            background: #252526;
            border-right: 1px solid #404040;
            display: flex;
            flex-direction: column;
        }

        .explorer-header {
            background: #2d2d2d;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #404040;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .explorer-controls {
            display: flex;
            gap: 0.5rem;
        }

        .explorer-controls button {
            padding: 0.25rem 0.5rem;
            font-size: 0.8rem;
        }

        @media (max-width: 480px) {
            .explorer-controls {
                flex-wrap: wrap;
            }
            .explorer-controls button {
                padding: 0.2rem 0.4rem;
                font-size: 0.7rem;
            }
        }

        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
            border-radius: 3px;
            font-size: 0.9rem;
            margin: 1px 0;
        }

        .file-item:hover {
            background: #404040;
        }

        .file-item.selected {
            background: #0e639c;
        }

        .file-item.directory {
            font-weight: 500;
        }

        .file-icon {
            width: 16px;
            height: 16px;
            margin-right: 0.5rem;
            flex-shrink: 0;
        }

        .expand-icon {
            width: 12px;
            height: 12px;
            margin-right: 0.25rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .expand-icon.expanded {
            transform: rotate(90deg);
        }

        .file-children {
            margin-left: 1rem;
            display: none;
        }

        .file-children.expanded {
            display: block;
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .editor-panel {
            flex: 1 1 0%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #404040;
            min-height: 0;
            overflow: auto;
        }

        .editor-header {
            background: #2d2d2d;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #404040;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .output-panel {
            flex: 1 1 0%;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: auto;
        }

        .output-header {
            background: #2d2d2d;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #404040;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .CodeMirror {
            flex: 1;
            font-size: 14px;
            line-height: 1.4;
        }

        .output {
            flex: 1;
            background: #1a1a1a;
            padding: 1rem;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            white-space: pre-wrap;
            color: #e6e6e6;
        }

        .status {
            background: #2d2d2d;
            padding: 0.5rem 1rem;
            border-top: 1px solid #404040;
            font-size: 0.85rem;
            color: #8892b0;
        }

        .loading {
            color: #64ffda;
        }

        .error {
            color: #ff6b6b;
        }

        .success {
            color: #69db7c;
        }

        .demo-list {
            margin-left: auto;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2d2d2d;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #404040;
            min-width: 300px;
        }

        .modal h3 {
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .modal input {
            width: 100%;
            padding: 0.5rem;
            background: #404040;
            border: 1px solid #555;
            border-radius: 4px;
            color: white;
            margin-bottom: 1rem;
        }

        .modal-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        @media (max-width: 1024px) {
            .file-explorer {
                width: 250px;
            }
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            
            .file-explorer {
                width: 100%;
                height: 200px;
                border-right: none;
                border-bottom: 1px solid #404040;
            }

            .editor-container {
                flex-direction: column;
            }

            .editor-panel {
                border-right: none;
                border-bottom: 1px solid #404040;
            }

            .controls {
                font-size: 0.8rem;
            }
        }

        .context-menu {
            display: none;
            position: fixed;
            background: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 0.25rem 0;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .context-menu-item {
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .context-menu-item:hover {
            background: #404040;
        }

        .file-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>

            sqlite: `<?php
// SQLite Demo
echo "=== SQLite Demo ===\\n";

try {
    // Create in-memory database
    $pdo = new PDO('sqlite::memory:');
    $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
    
    // Create table
    $pdo->exec("CREATE TABLE users (
        id INTEGER PRIMARY KEY,
        name TEXT NOT NULL,
        email TEXT UNIQUE
    )");
    
    // Insert data
    $stmt = $pdo->prepare("INSERT INTO users (name, email) VALUES (?, ?)");
    $stmt->execute(['John Doe', 'john@example.com']);
    $stmt->execute(['Jane Smith', 'jane@example.com']);
    
    // Query data
    $stmt = $pdo->query("SELECT * FROM users");
    while ($row = $stmt->fetch(PDO::FETCH_ASSOC)) {
        echo "User: {$row['name']} ({$row['email']})\\n";
    }
    
    echo "SQLite working perfectly!\\n";
    
} catch (Exception $e) {
    echo "Error: " . $e->getMessage() . "\\n";
}
?>`,

            generators: `<?php
// Generators and Iterators Demo
echo "=== Generators Demo ===\\n";

function fibonacci($max) {
    $a = 0;
    $b = 1;
    
    yield $a;
    yield $b;
    
    while ($a + $b <= $max) {
        $c = $a + $b;
        yield $c;
        $a = $b;
        $b = $c;
    }
}

echo "Fibonacci sequence up to 100:\\n";
foreach (fibonacci(100) as $num) {
    echo "$num ";
}
echo "\\n\\n";

// Generator with send()
function counter() {
    $value = 0;
    while (true) {
        $increment = yield $value;
        $value += $increment ?: 1;
    }
}

echo "Counter generator:\\n";
$gen = counter();
echo "Start: " . $gen->current() . "\\n";
$gen->next();
echo "Next: " . $gen->current() . "\\n";
$gen->send(5);
echo "After send(5): " . $gen->current() . "\\n";
?>`,

    };

?>`,

// Enums Demo (PHP 8.1+)

enum Status {
    case PENDING;
    case APPROVED;
    case REJECTED;
}

enum Priority: int {
    case LOW = 1;
    case MEDIUM = 2;

        return match($this) {
            Priority::LOW => 'Low Priority',
            Priority::MEDIUM => 'Medium Priority',

        };
    }

}
?>`,

        // File Explorer Functions
        function refreshFileTree() {
            if (!isReady || !Module || !Module.vfs) {
                return;
            }

            let iterator = null;

            try {
                iterator = Module.vfs.iterate('/');
                const files =
                    iterator.all(true);
                renderFileTree(files);
            } catch (error) {
                console.error('Error refreshing file tree:', error);
                updateStatus('Error refreshing file tree', 'error');
            } finally {
                if (iterator) {
                    iterator.free();
                }
            }
        }

        function renderFileTree(files, container = fileTree, basePath = 'vfs://') {
            // Keep the root vfs:// item, clear children
            if (container === fileTree) {
                const rootItem = container.querySelector('.file-item');
                const existingChildren = container.querySelector('.file-children');
                if (existingChildren) {
                    existingChildren.remove();
                }
                
                if (files.length > 0) {
                    const childrenContainer = document.createElement('div');
                    childrenContainer.className = 'file-children expanded';
                    renderFileItems(files, childrenContainer, basePath);
                    container.appendChild(childrenContainer);
                    
                    const expandIcon = rootItem.querySelector('.expand-icon');
                    expandIcon.textContent = '▼';
                    expandIcon.classList.add('expanded');
                }
            } else {
                renderFileItems(files, container, basePath);
            }
        }

        function renderFileItems(files, container, basePath) {
            container.innerHTML = '';
            
            files.forEach(file => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.dataset.path = basePath + file.name;
                
                if (file.kind === Module.vfs.EM_VFS_DIR) {
                    item.classList.add('directory');
                    
                    const expandIcon = document.createElement('span');
                    expandIcon.className = 'expand-icon';
                    expandIcon.textContent = file.children ? '▼' : '▶';
                    if (file.children) expandIcon.classList.add('expanded');
                    item.appendChild(expandIcon);
                    
                    const icon = document.createElement('span');
                    icon.className = 'file-icon';
                    icon.textContent = '📁';
                    item.appendChild(icon);
                    
                    const name = document.createElement('span');
                    name.className = 'file-name';
                    name.textContent = file.name;
                    item.appendChild(name);
                    
                    container.appendChild(item);
                    
                    if (file.children) {
                        const childrenContainer = document.createElement('div');
                        childrenContainer.className = 'file-children expanded';
                        renderFileItems(file.children, childrenContainer, basePath + file.name + '/');
                        container.appendChild(childrenContainer);
                    }
                    
                    expandIcon.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleDirectory(item);
                    });
                } else {
                    const icon = document.createElement('span');
                    icon.className = 'file-icon';
                    icon.textContent = getFileIcon(file.name);
                    item.appendChild(icon);
                    
                    const name = document.createElement('span');
                    name.className = 'file-name';
                    name.textContent = file.name;
                    item.appendChild(name);
                    
                    container.appendChild(item);
                }
                
                // Event listeners
                item.addEventListener('click', () => selectFile(item));
                item.addEventListener('dblclick', () => openFile(item.dataset.path));
                item.addEventListener('contextmenu', (e) => showContextMenu(e, item.dataset.path));
            });
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            switch (ext) {
                case 'php': return '🐘';
                case 'js': return '📜';
                case 'json': return '📋';
                case 'txt': return '📄';
                case 'md': return '📝';
                case 'html': case 'htm': return '🌐';
                case 'css': return '🎨';
                case 'sql': return '🗃️';
                default: return '📄';
            }
        }

        function toggleDirectory(item) {
            const expandIcon = item.querySelector('.expand-icon');
            const nextSibling = item.nextElementSibling;
            
            if (nextSibling && nextSibling.classList.contains('file-children')) {
                if (nextSibling.classList.contains('expanded')) {
                    nextSibling.classList.remove('expanded');
                    expandIcon.textContent = '▶';
                    expandIcon.classList.remove('expanded');
                } else {
                    nextSibling.classList.add('expanded');
                    expandIcon.textContent = '▼';
                    expandIcon.classList.add('expanded');
                }
            }
        }

        function selectFile(item) {
            // Remove previous selection
            document.querySelectorAll('.file-item.selected').forEach(el => {
                el.classList.remove('selected');
            });
            
            // Add selection to current item
            item.classList.add('selected');
        }

        function openFile(path) {
            if (!isReady || !Module || !Module.vfs) {
                updateStatus('PHP runtime not ready', 'error');
                return;
            }

            try {
                const content = Module.vfs.get(path);
                if (content === false) {
                    updateStatus(`Failed to open file: ${path}`, 'error');
                    return;
                }

                // Convert Uint8Array to string
                const decoder = new TextDecoder('utf-8');
                const text = decoder.decode(content);

                // Save current file if there are unsaved changes
                if (currentOpenFile && unsavedChanges) {
                    if (!confirm('You have unsaved changes. Open new file anyway?')) {
                        return;
                    }
                }

                editor.setValue(text);
                currentOpenFile = path;
                unsavedChanges = false;
                updateCurrentFileDisplay();
                updateStatus(`Opened: ${path}`, 'success');
            } catch (error) {
                console.error('Error opening file:', error);
                updateStatus(`Error opening file: ${path}`, 'error');
            }
        }

        function saveCurrentFile() {
            if (!currentOpenFile) {
                updateStatus('No file open to save', 'error');
                return;
            }

            if (!isReady || !Module || !Module.vfs) {
                updateStatus('PHP runtime not ready', 'error');
                return;
            }

            try {
                const content = editor.getValue();
                const success = Module.vfs.put(currentOpenFile, content);
                
                if (success) {
                    unsavedChanges = false;
                    updateCurrentFileDisplay();
                    updateStatus(`Saved: ${currentOpenFile}`, 'success');
                    refreshFileTree();
                } else {
                    updateStatus(`Failed to save: ${currentOpenFile}`, 'error');
                }
            } catch (error) {
                console.error('Error saving file:', error);
                updateStatus(`Error saving file: ${currentOpenFile}`, 'error');
            }
        }

        function updateCurrentFileDisplay() {
            if (currentOpenFile) {
                const filename = currentOpenFile.split('/').pop();
                currentFileElement.textContent = filename + (unsavedChanges ? ' •' : '');
            } else {
                currentFileElement.textContent = 'PHP Code Editor';
            }
        }

        function showContextMenu(e, path) {
            e.preventDefault();
            currentContextPath = path;
            
            contextMenu.style.display = 'block';
            contextMenu.style.left = e.pageX + 'px';
            contextMenu.style.top = e.pageY + 'px';
        }

        function hideContextMenu() {
            contextMenu.style.display = 'none';
        }

        function showModal(title, placeholder, action) {
            modalTitle.textContent = title;
            modalInput.placeholder = placeholder;
            modalInput.value = '';
            currentModalAction = action;
            // Set modalOk button text based on action
            switch (action) {
                case 'file':
                case 'folder':
                    modalOk.textContent = 'Create';
                    break;
                case 'rename':
                    modalOk.textContent = 'Rename';
                    break;
                default:
                    modalOk.textContent = 'OK';
            }
            fileModal.style.display = 'block';
            modalInput.focus();
        }

        function hideModal() {
            fileModal.style.display = 'none';
            currentModalAction = null;
        }

        function createFile() {
            if (!isReady || !Module || !Module.vfs) {
                updateStatus('PHP runtime not ready', 'error');
                return;
            }

            const filename = modalInput.value.trim();
            if (!filename) {
                updateStatus('Please enter a filename', 'error');
                return;
            }

            try {
                const success = Module.vfs.put(
                    filename, 
                    '<?php\n// New PHP file\necho "Hello from ' + filename + '!";\n?>');
                if (success) {
                    refreshFileTree();
                    openFile(filename);
                    updateStatus(`Created: ${filename}`, 'success');
                } else {
                    updateStatus(`Failed to create: ${filename}`, 'error');
                }
            } catch (error) {
                console.error('Error creating file:', error);
                updateStatus(`Error creating file: ${filename}`, 'error');
            }
            
            hideModal();
        }

        function createFolder() {
            if (!isReady || !Module || !Module.vfs) {
                updateStatus('PHP runtime not ready', 'error');
                return;
            }

            const foldername = modalInput.value.trim();
            if (!foldername) {
                updateStatus('Please enter a folder name', 'error');
                return;
            }

            const path = foldername.endsWith("/") ?
                foldername : foldername + "/";

            try {
                const success = Module.vfs.mkdir(path);
                if (success) {
                    refreshFileTree();
                    updateStatus(`Created folder: ${foldername}`, 'success');
                } else {
                    updateStatus(`Failed to create folder: ${foldername}`, 'error');
                }
            } catch (error) {
                console.error('Error creating folder:', error);
                updateStatus(`Error creating folder: ${foldername}`, 'error');
            }
            
            hideModal();
        }

        function renameFile() {
            if (!currentContextPath) return;

            const currentName = currentContextPath.split('/').pop();
            modalInput.value = currentName;
            showModal('Rename', 'Enter new name', 'rename');
        }

        function deleteFile() {
            if (!currentContextPath) return;
            
            if (!confirm(`Are you sure you want to delete ${currentContextPath}?`)) {
                return;
            }

            if (!isReady || !Module || !Module.vfs) {
                updateStatus('PHP runtime not ready', 'error');
                return;
            }

            try {
                const success = Module.vfs.unlink(currentContextPath, true);
                if (success) {
                    // Close file if it's currently open
                    if (currentOpenFile === currentContextPath) {
                        currentOpenFile = null;
                        unsavedChanges = false;
                        updateCurrentFileDisplay();
                        editor.setValue('');
                    }
                    
                    refreshFileTree();
                    updateStatus(`Deleted: ${currentContextPath}`, 'success');
                } else {
                    updateStatus(`Failed to delete: ${currentContextPath}`, 'error');
                }
            } catch (error) {
                console.error('Error deleting file:', error);
                updateStatus(`Error deleting: ${currentContextPath}`, 'error');
            }
        }

        function performRename() {
            if (!currentContextPath) {
                return;
            }

            const newName = modalInput.value.trim();
            if (!newName) {
                updateStatus('Please enter a new name', 'error');
                return;
            }

            const pathParts = currentContextPath.split('/');
            pathParts[pathParts.length - 1] = newName;
            const newPath = pathParts.join('/');

            if (!isReady || !Module || !Module.vfs) {
                updateStatus('PHP runtime not ready', 'error');
                return;
            }

            try {
                const success = Module.vfs.move(currentContextPath, newPath);
                if (success) {
                    // Update current open file path if renamed
                    if (currentOpenFile === currentContextPath) {
                        currentOpenFile = newPath;
                        updateCurrentFileDisplay();
                    }
                    refreshFileTree();
                    updateStatus(`Renamed to: ${newName}`, 'success');
                } else {
                    updateStatus(`Failed to rename: ${currentContextPath}`, 'error');
                }
            } catch (error) {
                updateStatus(`Error renaming: ${currentContextPath}`, 'error');
            }
            hideModal();
        }

        // Set up event handlers
        function initializeEventHandlers() {
            phpVersionSelect.value = currentPHPVersion;
            phpVersionSelect.addEventListener('change', switchPHPVersion);
            runButton.addEventListener('click', runCode);
            clearOutputButton.addEventListener('click', clearOutput);
            resetVFSButton.addEventListener('click', () => {
                resetVFS();
                refreshFileTree();
            });
            demoSelect.addEventListener('change', loadDemo);

            // File explorer event handlers
            newFileButton.addEventListener('click', () => {
                showModal('New File', 'Enter filename (e.g., script.php)', 'file');
            });
            
            newFolderButton.addEventListener('click', () => {
                showModal('New Folder', 'Enter folder name', 'folder');
            });
            
            refreshFilesButton.addEventListener('click', refreshFileTree);

            // Modal event handlers
            modalCancel.addEventListener('click', hideModal);
            modalOk.addEventListener('click', function handleModalOk() {
                const modalVisible = window.getComputedStyle(fileModal).display !== 'none';
                if (!modalVisible || !currentModalAction) return;
                switch (currentModalAction) {
                    case 'file':
                        createFile();
                        break;
                    case 'folder':
                        createFolder();
                        break;
                    case 'rename':
                        performRename();
                        break;
                }
            });

            modalInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    modalOk.click();
                } else if (e.key === 'Escape') {
                    hideModal();
                }
            });

            // Context menu event handlers
            document.addEventListener('click', hideContextMenu);
            
            contextMenu.addEventListener('click', (e) => {
                e.stopPropagation();
                // Ensure we get the correct menu item even if a child is clicked
                const item = e.target.closest('.context-menu-item');
                if (!item) return;
                const action = item.dataset.action;
                switch (action) {
                    case 'open':
                        openFile(currentContextPath);
                        break;
                    case 'rename':
                        renameFile();
                        break;
                    case 'delete':
                        deleteFile();
                        break;
                }
                hideContextMenu();
            });

            // Root VFS directory click handler
            const rootItem = fileTree.querySelector('.file-item');
            rootItem.addEventListener('click', () => selectFile(rootItem));
            
            const rootExpandIcon = rootItem.querySelector('.expand-icon');
            rootExpandIcon.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleDirectory(rootItem);
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    switch (e.key) {
                        case 's':
                            e.preventDefault();
                            saveCurrentFile();
                            break;
                        case 'n':
                            e.preventDefault();
                            showModal('New File', 'Enter filename (e.g., script.php)', 'file');
                            break;
                    }
                }
            });
        }

        // Switch PHP version by reloading page
        function switchPHPVersion() {
            const newVersion = phpVersionSelect.value;
            if (newVersion !== currentPHPVersion) {
                const url = new URL(window.location);
                url.searchParams.set('php', newVersion);
                
                // Preserve current code in sessionStorage
                if (editor) {
                    sessionStorage.setItem('em-demo-code', editor.getValue());
                }
                
                window.location = url;
            }
        }

        // Load demo
        function loadDemo() {
            const selectedDemo = demoSelect.value;
            if (selectedDemo && demos[selectedDemo]) {
                editor.setValue(demos[selectedDemo]);
                demoSelect.value = ''; // Reset selection
                currentOpenFile = null;
                unsavedChanges = false;
                updateCurrentFileDisplay();
            }
        }

        // Clear output
        function clearOutput() {
            output.textContent = '';
            outputStatus.textContent = '';
        }

        // Reset VFS
        function resetVFS() {
            if (Module && Module.vfs) {
                Module.vfs.reset();
                currentOpenFile = null;
                unsavedChanges = false;
                updateCurrentFileDisplay();
                editor.setValue('');
                updateStatus('VFS reset successfully', 'success');
            }
        }

        // Update status
        function updateStatus(message, type = '') {
            statusBar.textContent = message;
            statusBar.className = 'status ' + type;
        }

        // Run PHP code
        function runCode() {
            if (!isReady || !Module) {
                updateStatus('PHP runtime not ready', 'error');
                return;
            }
            
            const code = editor.getValue().trim();
            if (!code) {
                updateStatus('No code to run', 'error');
                return;
            }
            
            runButton.disabled = true;
            updateStatus('Running code...', 'loading');
            outputStatus.textContent = 'Running...';
            
            try {
                const result = Module.invoke(code);
                output.textContent = result;
                updateStatus('Code executed successfully', 'success');
                outputStatus.textContent = 'Complete';
            } catch (error) {
                output.textContent = `Error: ${error.message}`;
                updateStatus('Execution failed', 'error');
                outputStatus.textContent = 'Error';
                console.error('Execution error:', error);
            } finally {
                runButton.disabled = false;
                refreshFileTree();
            }
        }

        // Initialize CodeMirror
        function initializeEditor() {
            editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
                mode: 'application/x-httpd-php',
                theme: 'monokai',
                lineNumbers: true,
                indentUnit: 4,
                indentWithTabs: false,
                lineWrapping: true,
                extraKeys: {
                    'Ctrl-Enter': runCode,
                    'Cmd-Enter': runCode,
                    'Ctrl-S': saveCurrentFile,
                    'Cmd-S': saveCurrentFile
                }
            });

            // Track changes for unsaved indicator
            editor.on('change', () => {
                if (currentOpenFile) {
                    unsavedChanges = true;
                    updateCurrentFileDisplay();
                }
            });

            // Restore code from sessionStorage if available
            const savedCode = sessionStorage.getItem('em-demo-code');
            if (savedCode) {
                editor.setValue(savedCode);
                sessionStorage.removeItem('em-demo-code');
            } else {
                // Default demo code
                editor.setValue(demos.hello);
            }
        }

        // Load PHP runtime
        function loadPHPRuntime() {
            updateStatus(`Loading PHP ${currentPHPVersion}...`, 'loading');
            editorStatus.textContent = 'Loading...';
            
            const script = document.createElement('script');
            script.src = `./latest/${currentPHPVersion}/php-em.js`;
            
            script.onload = () => {
                // Wait for Module to be ready
                const checkReady = () => {
                    if (typeof Module !== 'undefined' && Module && Module.ready) {
                        isReady = true;
                        updateStatus(`PHP ${currentPHPVersion} ready - Press Ctrl+Enter to run code`, 'success');
                        editorStatus.textContent = `PHP ${currentPHPVersion}`;
                        runButton.disabled = false;
                        output.textContent = 'Ready! Click "Run Code" or press Ctrl+Enter to execute PHP code.';
                        
                        // Enable file explorer buttons
                        newFileButton.disabled = false;
                        newFolderButton.disabled = false;
                        refreshFilesButton.disabled = false;
                        
                        // Initialize file tree
                        refreshFileTree();
                    } else {
                        setTimeout(checkReady, 100);
                    }
                };
                checkReady();
            };
            
            script.onerror = () => {
                updateStatus(`Failed to load PHP ${currentPHPVersion}`, 'error');
                editorStatus.textContent = 'Error';
                output.textContent = `Failed to load PHP ${currentPHPVersion}. Make sure the files are available at ./latest/${currentPHPVersion}/php-em.js`;
            };
            
            document.head.appendChild(script);
        }

        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', () => {
            initializeEditor();
            initializeEventHandlers();
            loadPHPRuntime();
        });
    </script>
</body>
</html>
